name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  RESPECTED_TEST_PYTHON: python

jobs:
  build:
    name: Native release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            distribution: dist/RespectedBrain
          - os: macos-latest
            platform: macos
            distribution: dist/RespectedBrain.app
          - os: ubuntu-latest
            platform: linux
            distribution: dist/RespectedBrain
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package and native build tools
        run: python -m pip install -e ".[dev]"
      - name: Verify repository atlas coverage and descriptions
        run: python tools/repository_map.py --check
      - name: Read package version and check release tag
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c "from importlib.metadata import version; print(version('respectedbrain'))")
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag must match package version v$VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install Inno compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno installation failed" }
          $Compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path -LiteralPath $Compiler)) { throw "Inno compiler missing" }
          "INNO_COMPILER=$Compiler" >> $env:GITHUB_ENV
      - name: Build native distribution
        run: python tools/build_installer.py --platform ${{ matrix.platform }} --output dist
      - name: Verify frozen launcher without system Python
        run: python tools/verify_distribution.py --platform ${{ matrix.platform }} --distribution "${{ matrix.distribution }}"
      - name: Run full suite against native build
        run: python -m unittest discover -s tests -p "*test*.py"
      - name: Physical host package smoke
        run: python tests/smoke/platform_smoke.py --package "${{ matrix.distribution }}" --output native-smoke.json
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath dist/RespectedBrain-Windows-Setup.exe -Destination "release-assets/RespectedBrain-v$env:RELEASE_VERSION-Windows-Setup.exe"
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets release-stage
          cp -R dist/RespectedBrain.app release-stage/
          cp dist/setup.command release-stage/
          chmod +x release-stage/setup.command
          hdiutil create -volname "Respected Brain" -srcfolder release-stage -ov -format UDZO "release-assets/RespectedBrain-v$RELEASE_VERSION-macOS-Setup.dmg"
      - name: Package Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself
          mkdir -p release-assets release-stage
          cp -R dist/RespectedBrain release-stage/
          cp dist/setup.sh release-stage/
          chmod +x release-stage/setup.sh
          makeself ./release-stage "release-assets/RespectedBrain-v$RELEASE_VERSION-Linux-Setup.run" "Respected Brain" ./setup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-${{ matrix.platform }}
          path: native-smoke.json
          if-no-files-found: warn

  publish-release:
    name: Publish verified native assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RespectedBrain-*-Windows-Setup.exe
            RespectedBrain-*-macOS-Setup.dmg
            RespectedBrain-*-Linux-Setup.run
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
