name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  RESPECTED_TEST_PYTHON: python

jobs:
  build:
    name: Native release (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            distribution: dist/RespectedBrain
          - os: macos-latest
            platform: macos
            distribution: dist/RespectedBrain.app
          - os: ubuntu-latest
            platform: linux
            distribution: dist/RespectedBrain
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package and native build tools
        run: python -m pip install -e ".[dev]"
      - name: Verify repository atlas coverage and descriptions
        run: python tools/repository_map.py --check
      - name: Read package version and check release tag
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c "from importlib.metadata import version; print(version('respectedbrain'))")
          if [[ "$RELEASE_REF" == refs/tags/* && "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag must match package version v$VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install Inno compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno installation failed" }
          $Compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path -LiteralPath $Compiler)) { throw "Inno compiler missing" }
          "INNO_COMPILER=$Compiler" >> $env:GITHUB_ENV
      - name: Pin and verify GitHub CLI 2.102.0
        shell: bash
        env:
          GH_CLI_VERSION: "2.102.0"
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Windows-X64) asset="windows_amd64.zip"; archive="$RUNNER_TEMP/gh.zip" ;;
            Windows-ARM64) asset="windows_arm64.zip"; archive="$RUNNER_TEMP/gh.zip" ;;
            macOS-X64) asset="macOS_amd64.zip"; archive="$RUNNER_TEMP/gh.zip" ;;
            macOS-ARM64) asset="macOS_arm64.zip"; archive="$RUNNER_TEMP/gh.zip" ;;
            Linux-X64) asset="linux_amd64.tar.gz"; archive="$RUNNER_TEMP/gh.tar.gz" ;;
            Linux-ARM64) asset="linux_arm64.tar.gz"; archive="$RUNNER_TEMP/gh.tar.gz" ;;
            *) echo "Unsupported runner architecture: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          base="https://github.com/cli/cli/releases/download/v$GH_CLI_VERSION"
          curl -fsSLo "$archive" "$base/gh_${GH_CLI_VERSION}_${asset}"
          curl -fsSLo "$RUNNER_TEMP/gh_checksums.txt" "$base/gh_${GH_CLI_VERSION}_checksums.txt"
          ASSET_NAME="gh_${GH_CLI_VERSION}_${asset}" ASSET_PATH="$archive" python -c 'import hashlib,os,pathlib; expected=next(line.split()[0] for line in pathlib.Path(os.environ["RUNNER_TEMP"],"gh_checksums.txt").read_text().splitlines() if line.strip().endswith(" "+os.environ["ASSET_NAME"])); actual=hashlib.sha256(pathlib.Path(os.environ["ASSET_PATH"]).read_bytes()).hexdigest(); assert actual==expected,(actual,expected)'
          mkdir -p .tooling/gh
          case "$asset" in
            *.zip) unzip -q "$archive" -d .tooling/gh ;;
            *.tar.gz) tar -xzf "$archive" -C .tooling/gh ;;
          esac
          bin="$(find "$PWD/.tooling/gh" -type f -path '*/bin/gh' -o -type f -path '*/bin/gh.exe' | head -n 1)"
          test -n "$bin"
          "$bin" --version | grep -F "gh version $GH_CLI_VERSION"
          dirname "$bin" >> "$GITHUB_PATH"
      - name: Build native distribution
        run: python tools/build_installer.py --platform ${{ matrix.platform }} --output dist --no-installer
      - name: Attest distribution manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.distribution }}/distribution.json
      - name: Download exactly one manifest attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          mkdir attestation-download
          cd attestation-download
          gh attestation download "../$DISTRIBUTION/distribution.json" \
            --repo "${{ github.repository }}" \
            --limit 1 \
            --predicate-type "https://slsa.dev/provenance/v1"
          bundles=(*.jsonl)
          test "${#bundles[@]}" -eq 1
          test -f "${bundles[0]}"
          mv "${bundles[0]}" "../$DISTRIBUTION/distribution.json.attestation.json"
      - name: Verify embedded manifest provenance
        run: >-
          python tools/verify_distribution.py
          --platform ${{ matrix.platform }}
          --distribution "${{ matrix.distribution }}"
          --require-provenance
      - name: Run full suite against native build
        run: python tests/run_all.py --python-only
      - name: Physical host package smoke
        run: python tests/smoke/platform_smoke.py --package "${{ matrix.distribution }}" --output native-smoke.json --strict-lifecycle
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          & $env:INNO_COMPILER "/DMyAppVersion=$env:RELEASE_VERSION" "/DPayloadDir=$PWD/dist/RespectedBrain" "/DOutputDir=$PWD/release-assets" "$PWD/packaging/windows/respected_setup.iss"
          Move-Item -LiteralPath release-assets/RespectedBrain-Windows-Setup.exe -Destination "release-assets/RespectedBrain-v$env:RELEASE_VERSION-Windows-Setup.exe"
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets release-stage
          cp -R dist/RespectedBrain.app release-stage/
          cp dist/setup.command release-stage/
          chmod +x release-stage/setup.command
          hdiutil create -volname "Respected Brain" -srcfolder release-stage -ov -format UDZO "release-assets/RespectedBrain-v$RELEASE_VERSION-macOS-Setup.dmg"
      - name: Package Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself
          mkdir -p release-assets release-stage
          cp -R dist/RespectedBrain release-stage/
          cp dist/setup.sh release-stage/
          chmod +x release-stage/setup.sh
          makeself ./release-stage "release-assets/RespectedBrain-v$RELEASE_VERSION-Linux-Setup.run" "Respected Brain" ./setup.sh
      - name: Attest outer release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*
      - name: Verify outer release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release-assets/*; do
            gh attestation verify "$asset" \
              --repo "${{ github.repository }}" \
              --cert-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --source-ref "${{ github.ref }}" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --deny-self-hosted-runners \
              --limit 1 \
              --format json
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-${{ matrix.platform }}
          path: native-smoke.json
          if-no-files-found: warn

  publish-release:
    name: Publish verified native assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RespectedBrain-*-Windows-Setup.exe
            RespectedBrain-*-macOS-Setup.dmg
            RespectedBrain-*-Linux-Setup.run
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
