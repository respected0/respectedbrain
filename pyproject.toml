[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "respectedbrain"
version = "0.0.1"
description = "Local, provider-neutral memory for a personal Markdown vault"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["build>=1", "pyinstaller>=6", "tomli>=2; python_version < '3.11'"]

[project.scripts]
respectedbrain = "respectedbrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"respectedbrain.resources" = [
  "defaults.json",
  "gateway/web/index.html",
  "instructions/default.md",
  "integrations/.agents/hooks.json",
  "integrations/.agents/rules/beyin.md",
  "integrations/.agents/rules/software-quality-1.md",
  "integrations/.agents/rules/software-quality-2.md",
  "integrations/.claude/hooks/lib.sh",
  "integrations/.claude/hooks/post-compact.sh",
  "integrations/.claude/hooks/pre-compact.sh",
  "integrations/.claude/hooks/prompt-counter.sh",
  "integrations/.claude/hooks/session-end.sh",
  "integrations/.claude/hooks/session-start.sh",
  "integrations/.claude/hooks/session-stop-capture.ps1",
  "integrations/.claude/hooks/session-stop-capture.sh",
  "integrations/.claude/settings.json",
  "integrations/.codex/hooks.json",
  "integrations/.cursor/hooks.json",
  "integrations/.cursor/rules/beyin.mdc",
  "integrations/.cursor/rules/software-quality-1.mdc",
  "integrations/.cursor/rules/software-quality-2.mdc",
  "integrations/.gemini/GEMINI.md",
  "integrations/.gemini/settings.json",
  "integrations/AGENTS.md",
  "integrations/CLAUDE.md",
  "skills/ajan-gecmis-tara/SKILL.md",
